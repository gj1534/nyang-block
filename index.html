<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!--ARTIFACT-START-->
<title>냥냥 블럭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="css/style.css">
<!--ARTIFACT-HEAD-END-->
</head>
<body data-season="home">
<!--ARTIFACT-BODY-START-->
<canvas id="weather" aria-hidden="true"></canvas>
<canvas id="stage" aria-label="냥냥 블럭 게임판"></canvas>

<header id="hud" class="dim">
  <div class="hud-left">
    <button class="icon-btn" id="pauseBtn" aria-label="일시 정지">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
    </button>
    <div class="best" id="bestChip" title="최고 기록">
      <svg width="20" height="16" viewBox="0 0 20 16" aria-hidden="true"><path d="M2 5l4 3.5L10 2l4 6.5L18 5l-1.6 9H3.6z" fill="#FFC94D" stroke="#E8AE2C" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <span id="best">0</span>
    </div>
  </div>
  <div class="hud-center">
    <div id="freeInfo" class="scorebox">
      <span class="label">점수</span>
      <span id="score">0</span>
      <span id="combo" hidden></span>
    </div>
    <div id="storyInfo" class="storybox" hidden>
      <span class="stage-label" id="stageLabel"></span>
      <div class="goals" id="goals"></div>
    </div>
  </div>
  <div class="hud-right">
    <div class="moves" id="movesPill" hidden><span class="label">남은 고양이</span><b id="moves">0</b></div>
    <button class="icon-btn" id="soundBtn" aria-label="소리 끄기">
      <svg id="icoOn" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg id="icoOff" hidden width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </div>
</header>

<div id="fx"></div>
<div id="banner"><span class="big"></span><span class="small" hidden></span></div>

<!-- 처음 화면 -->
<section class="overlay" id="titleScr">
  <div class="card title-card">
    <div class="title-art" aria-hidden="true">
      <svg class="mascot" viewBox="0 0 120 100">
        <path d="M20 44 L26 7 L54 28 Z" fill="#FFB661" stroke="#FFB661" stroke-width="6" stroke-linejoin="round"/>
        <path d="M100 44 L94 7 L66 28 Z" fill="#FFB661" stroke="#FFB661" stroke-width="6" stroke-linejoin="round"/>
        <path d="M28 34 L30 17 L43 27Z" fill="#FF9DB2" stroke="#FF9DB2" stroke-width="3" stroke-linejoin="round"/>
        <path d="M92 34 L90 17 L77 27Z" fill="#FF9DB2" stroke="#FF9DB2" stroke-width="3" stroke-linejoin="round"/>
        <ellipse cx="60" cy="60" rx="47" ry="37" fill="#FFB661"/>
        <path d="M50 27 q1 8 0 12 M60 25 q1 9 0 14 M70 27 q1 8 0 12" stroke="#EE8F3C" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <ellipse cx="41" cy="57" rx="6.5" ry="8" fill="#3A2A32"/><circle cx="39" cy="54" r="2.4" fill="#fff"/>
        <ellipse cx="79" cy="57" rx="6.5" ry="8" fill="#3A2A32"/><circle cx="77" cy="54" r="2.4" fill="#fff"/>
        <ellipse cx="27" cy="70" rx="8" ry="5" fill="#FF7F9E" opacity=".5"/><ellipse cx="93" cy="70" rx="8" ry="5" fill="#FF7F9E" opacity=".5"/>
        <ellipse cx="60" cy="65" rx="4.5" ry="3.2" fill="#FF8FA8"/>
        <path d="M52 70 q4 5.5 8 0 q4 5.5 8 0" stroke="#5B3A44" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      </svg>
      <svg class="mascot small" viewBox="0 0 120 100">
        <path d="M20 44 L26 7 L54 28 Z" fill="#554A5F" stroke="#554A5F" stroke-width="6" stroke-linejoin="round"/>
        <path d="M100 44 L94 7 L66 28 Z" fill="#554A5F" stroke="#554A5F" stroke-width="6" stroke-linejoin="round"/>
        <path d="M28 34 L30 17 L43 27Z" fill="#FF9DB2" stroke="#FF9DB2" stroke-width="3" stroke-linejoin="round"/>
        <path d="M92 34 L90 17 L77 27Z" fill="#FF9DB2" stroke="#FF9DB2" stroke-width="3" stroke-linejoin="round"/>
        <ellipse cx="60" cy="60" rx="47" ry="37" fill="#554A5F"/>
        <ellipse cx="41" cy="57" rx="6.5" ry="8" fill="#E2EE78"/><ellipse cx="41" cy="57" rx="2.2" ry="6" fill="#2B2233"/>
        <ellipse cx="79" cy="57" rx="6.5" ry="8" fill="#E2EE78"/><ellipse cx="79" cy="57" rx="2.2" ry="6" fill="#2B2233"/>
        <ellipse cx="60" cy="65" rx="4.5" ry="3.2" fill="#FF8FA8"/>
        <path d="M52 70 q4 5.5 8 0 q4 5.5 8 0" stroke="#FFC7D4" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="eyebrow">할머니의 고양이 다락</p>
    <h1>냥냥 블럭</h1>
    <p class="sub story-font">흩어진 고양이들을 찾아, 다락에 다시 불을 켜 주세요.</p>
    <div class="actions">
      <button class="btn big" id="storyBtn">이야기 시작</button>
      <p class="hint" id="storyHint"></p>
      <div class="row">
        <button class="btn secondary" id="freeBtn">자유 모드</button>
        <button class="btn secondary" id="albumBtn">고양이 앨범 <span class="count" id="albumCount">1/8</span></button>
      </div>
    </div>
    <p class="best-line">자유 모드 최고 기록 <b id="bestStart">0</b></p>
  </div>
</section>

<!-- 이야기 지도 -->
<section class="screen map" id="mapScr" hidden>
  <header class="map-head">
    <button class="icon-btn" id="mapBack" aria-label="처음 화면으로">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="map-title"><p class="eyebrow">할머니의 고양이 다락</p><h2>다락방 이야기</h2></div>
    <span class="star-total" id="starTotal"></span>
  </header>
  <div class="map-list" id="mapList"></div>
</section>

<!-- 스테이지 카드 -->
<section class="overlay" id="stageScr" hidden>
  <div class="card stage-card">
    <p class="eyebrow" id="stEyebrow"></p>
    <h2 id="stTitle"></h2>
    <div class="mini-stars" id="stStars" hidden></div>
    <p class="story-text" id="stStory"></p>
    <ul class="goal-list" id="stGoals"></ul>
    <p class="meta">고양이 블럭 <b id="stMoves">0</b>개로 해내요</p>
    <p class="meta leaf-note" id="stLeaf" hidden></p>
    <div class="actions">
      <button class="btn big" id="stStart">이야기 시작하기</button>
      <button class="btn ghost" id="stBack">지도로</button>
    </div>
  </div>
</section>

<!-- 대화 -->
<section class="screen talk" id="talkScr" hidden>
  <button class="skip" id="talkSkip" type="button">건너뛰기</button>
  <div class="talk-box" id="talkBox" role="dialog" aria-live="polite">
    <div class="portrait" id="talkFace"></div>
    <div class="talk-body">
      <p class="who" id="talkWho"></p>
      <p class="line" id="talkText"></p>
    </div>
    <span class="next" aria-hidden="true"></span>
  </div>
</section>

<!-- 편지 -->
<section class="screen letter" id="letterScr" hidden>
  <article class="paper">
    <p class="from" id="letterFrom"></p>
    <div class="hand" id="letterText"></div>
    <button class="btn" id="letterBtn">편지를 간직해요</button>
  </article>
</section>

<!-- 스테이지 결과 -->
<section class="overlay" id="resultScr" hidden>
  <div class="card">
    <p class="eyebrow" id="resEyebrow"></p>
    <div class="big-stars" id="resStars"></div>
    <h2 id="resTitle"></h2>
    <p class="sub" id="resSub"></p>
    <div class="reveal" id="resReveal" hidden></div>
    <div class="actions">
      <button class="btn big" id="resNext">다음 이야기</button>
      <div class="row">
        <button class="btn secondary" id="resRetry">다시 하기</button>
        <button class="btn secondary" id="resMap">지도로</button>
      </div>
    </div>
  </div>
</section>

<!-- 스테이지 실패 -->
<section class="overlay" id="failScr" hidden>
  <div class="card">
    <svg class="mascot" viewBox="0 0 120 100" aria-hidden="true">
      <path d="M20 44 L26 7 L54 28 Z" fill="#A4D3FF" stroke="#A4D3FF" stroke-width="6" stroke-linejoin="round"/>
      <path d="M100 44 L94 7 L66 28 Z" fill="#A4D3FF" stroke="#A4D3FF" stroke-width="6" stroke-linejoin="round"/>
      <path d="M28 34 L30 17 L43 27Z" fill="#FF9DB2" stroke="#FF9DB2" stroke-width="3" stroke-linejoin="round"/>
      <path d="M92 34 L90 17 L77 27Z" fill="#FF9DB2" stroke="#FF9DB2" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="60" cy="60" rx="47" ry="37" fill="#A4D3FF"/>
      <path d="M34 58 q7 6 14 0 M72 58 q7 6 14 0" stroke="#3A2A32" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="27" cy="70" rx="8" ry="5" fill="#FF7F9E" opacity=".5"/><ellipse cx="93" cy="70" rx="8" ry="5" fill="#FF7F9E" opacity=".5"/>
      <ellipse cx="60" cy="65" rx="4.5" ry="3.2" fill="#FF8FA8"/>
      <path d="M53 73 q7 -5 14 0" stroke="#5B3A44" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    </svg>
    <h2>조금만 더 해 볼까요?</h2>
    <p class="sub" id="failWhy"></p>
    <p class="meta" id="failGoal"></p>
    <div class="actions">
      <button class="btn big" id="failRetry">다시 하기</button>
      <button class="btn ghost" id="failMap">지도로</button>
    </div>
  </div>
</section>

<!-- 자유 모드 끝 -->
<section class="overlay" id="overScr" hidden>
  <div class="card">
    <svg class="mascot" viewBox="0 0 120 100" aria-hidden="true">
      <path d="M20 44 L26 7 L54 28 Z" fill="#A4D3FF" stroke="#A4D3FF" stroke-width="6" stroke-linejoin="round"/>
      <path d="M100 44 L94 7 L66 28 Z" fill="#A4D3FF" stroke="#A4D3FF" stroke-width="6" stroke-linejoin="round"/>
      <path d="M28 34 L30 17 L43 27Z" fill="#FF9DB2" stroke="#FF9DB2" stroke-width="3" stroke-linejoin="round"/>
      <path d="M92 34 L90 17 L77 27Z" fill="#FF9DB2" stroke="#FF9DB2" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="60" cy="60" rx="47" ry="37" fill="#A4D3FF"/>
      <path d="M34 58 q7 -6 14 0 M72 58 q7 -6 14 0" stroke="#3A2A32" stroke-width="3.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="27" cy="70" rx="8" ry="5" fill="#FF7F9E" opacity=".5"/><ellipse cx="93" cy="70" rx="8" ry="5" fill="#FF7F9E" opacity=".5"/>
      <ellipse cx="60" cy="65" rx="4.5" ry="3.2" fill="#FF8FA8"/>
      <path d="M52 70 q4 5.5 8 0 q4 5.5 8 0" stroke="#5B3A44" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    </svg>
    <h2>놓을 자리가 없어요</h2>
    <p class="sub">고양이들이 꽉 찼어요. 한 판 더 할까요?</p>
    <div class="final"><span class="label">이번 점수</span><span class="num" id="finalScore">0</span></div>
    <p class="record" id="newRecord" hidden>새 최고 기록!</p>
    <p class="best-line">최고 기록 <b id="bestOver">0</b></p>
    <div class="actions">
      <button class="btn big" id="againBtn">다시 하기</button>
      <button class="btn ghost" id="overHome">처음 화면으로</button>
    </div>
  </div>
</section>

<!-- 일시 정지 -->
<section class="overlay" id="pauseScr" hidden>
  <div class="card">
    <h2>잠깐 쉬어 가요</h2>
    <p class="sub" id="pauseNote"></p>
    <div class="actions">
      <button class="btn big" id="pauseResume">계속하기</button>
      <div class="row">
        <button class="btn secondary" id="pauseRetry">처음부터 다시</button>
        <button class="btn secondary" id="pauseExit">지도로 나가기</button>
      </div>
    </div>
  </div>
</section>

<!-- 고양이 앨범 -->
<section class="screen map album" id="albumScr" hidden>
  <header class="map-head">
    <button class="icon-btn" id="albumBack" aria-label="처음 화면으로">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="map-title"><p class="eyebrow">다락으로 돌아온 가족</p><h2>고양이 앨범</h2></div>
    <span class="star-total" id="albumCount2"></span>
  </header>
  <div class="album-grid" id="albumGrid"></div>
</section>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="js/game.js"></script>
<!--ARTIFACT-BODY-END-->
</body>
</html>
